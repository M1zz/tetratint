<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;

  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;

  .logo {
    width: 56px; height: 56px; border-radius: 14px; display: grid;

  .logo i { display: block; }
  .logo i:nth-child(1){ background:#0a84ff; }

  .logo i:nth-child(3){ background:#5ac8fa; }
  .logo i:nth-child(4){ background:#004299; }

  nav.langs a {
    border: 1px solid var(--border); color: var(--muted); font-size: 14px;
    padding: 3px 12px; border-radius: 999px; text-decoration: none;
  }
  nav.langs a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { color: var(--muted); font-size: 14px; text-align: center; margin-top: 40px; }

  body { min-height: 100vh; display: grid; place-items: center; }
  .wrap { max-width: 620px; padding: 48px 24px; text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 20px; margin: 0 auto 24px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  nav.langs { justify-content: center; }
  h1 { font-size: 40px; letter-spacing: -.03em; margin: 0 0 8px; }
  p.tag { color: var(--muted); font-size: 18px; margin: 0 0 20px; }
  p.desc { margin: 0 0 32px; }
  .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .links a {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    text-decoration: none; padding: 14px 24px; border-radius: 14px; font-weight: 600;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
