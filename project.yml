name: TetraTint
options:
  bundleIdPrefix: com.leeo
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"

# 버전·빌드 번호의 단일 소스 — DeployBar 가 배포할 때 이 파일을 고친다.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
targets:
  TetraTint:
    type: application
    platform: macOS
    sources:
      - TetraTint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.TetraTint
        # 버전·빌드 번호는 여기 두지 않는다 → Config/Version.xcconfig (위 configFiles).
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: TetraTint.entitlements
